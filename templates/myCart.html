{% extends "base.html" %}
{% block title %} Products {% endblock title %}
{% block body %}
<h2>My Cart</h2>
<table>
    <tr>
        <th>Item</th>
        <th>Quantity</th>
        <th>Price</th>
        <th>Total</th>
    </tr>
    {% for item in cart_items %}
    <tr>
        <td>{{ item.items }}</td>
        <td>{{ item.quantity }}</td>
        <td>{{ item.price }}</td>
        <td>{{ item.price|multiply:item.quantity }}</td>
    </tr>
    {% endfor %}
</table>
{% endblock body %}
